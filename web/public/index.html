<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="vv-token" content="__VV_TOKEN__">
  <title>ゲットVIDEO</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1>ゲットVIDEO <span class="edition">PC 版</span></h1>
    <p class="env" id="env" aria-live="polite"></p>
    <p class="account" id="account" data-user="__VV_USER__" hidden>
      <span id="account-user"></span>
      <button type="button" class="quiet" id="logout">ログアウト</button>
    </p>
  </header>

  <main>
    <section class="omni" aria-label="URL の入力">
      <label for="input">URL かキーワード</label>
      <div class="omni-row">
        <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="https://… を貼る">
        <select id="quality" aria-label="画質"></select>
      </div>
      <div class="password-row" id="password-row" hidden>
        <label for="password">動画のパスワード(Vidyard。空欄でも始められる)</label>
        <input id="password" type="password" autocomplete="off">
      </div>
      <div class="suggestions" id="suggestions"></div>
      <p class="notice" id="notice" role="status"></p>
    </section>

    <section aria-labelledby="h-browser">
      <h2 id="h-browser">ログイン用のブラウザ</h2>
      <p class="hint" id="browser-status"></p>
      <div class="bookmarks" id="bookmarks"></div>
    </section>

    <section aria-labelledby="h-queue">
      <h2 id="h-queue">実行中と順番待ち</h2>
      <ul class="jobs" id="jobs"></ul>
    </section>

    <section aria-labelledby="h-history">
      <div class="section-head">
        <h2 id="h-history">履歴</h2>
        <button type="button" class="quiet" id="clear-history">すべて消す</button>
      </div>
      <ul class="jobs" id="history"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
