<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン - ゲットVIDEO</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="login">
    <h1>ゲットVIDEO <span class="edition">PC 版</span></h1>
    <form id="login-form" novalidate>
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="primary" id="submit">ログイン</button>
    </form>
    <p class="notice" id="notice" role="alert"></p>
    <div id="google" hidden>
      <p class="or">または</p>
      <a class="button" href="/auth/google">Google でログイン</a>
    </div>
  </main>
  <script src="/login.js"></script>
</body>
</html>
